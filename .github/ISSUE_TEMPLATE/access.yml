name: 申请实验室入口访问
description: 提交 GitHub 账号供管理员审核；申请内容公开可见，请勿填写密码或其他敏感信息。
title: "[Access] "
labels: ["access-request"]
body:
  - type: markdown
    attributes:
      value: |
        此申请仅登记 GitHub 身份。请勿在 Issue 中填写密码、令牌、设备地址或实验数据。
  - type: input
    id: github-user
    attributes:
      label: GitHub 用户名
      description: 批准后只能使用这个 GitHub 账号登录。
      placeholder: octocat
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 访问用途
      description: 简要说明需要访问的功能，不要填写敏感项目内容。
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: 使用约束
      options:
        - label: 我不会共享账号、入口地址或访问到的非公开信息。
          required: true
