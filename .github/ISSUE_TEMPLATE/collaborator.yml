name: 申请成为合作者
description: 获批后可登录树莓派，并获得当前全部私有仓库的只读权限。
title: "[Collaborator] "
labels: ["collaborator-request"]
body:
  - type: markdown
    attributes:
      value: |
        请只填写可公开的信息。不要提交密码、令牌、设备地址、私有代码或未公开实验数据。
  - type: input
    id: github-user
    attributes:
      label: GitHub 用户名
      description: 仓库邀请只会发送给这个 GitHub 账号。
      placeholder: octocat
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: 计划贡献
      description: 说明准备解决的问题、可投入的工作以及相关经验。
    validations:
      required: true
  - type: input
    id: references
    attributes:
      label: 相关资料
      description: 可填写个人主页、公开仓库或相关 Issue/PR 链接。
      placeholder: https://github.com/username/project
  - type: checkboxes
    id: agreement
    attributes:
      label: 协作约束
      options:
        - label: 我理解申请需要人工审核；获批后可访问树莓派和全部私有仓库，并应遵守安全与保密要求。
          required: true
